<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dashboard — ChatBackend</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="page">
    <h1>Dashboard</h1>

    <div id="banner"></div>

    <h2>Status do sistema</h2>
    <div class="grid" id="stats">
      <div class="stat"><div class="label">Carregando…</div></div>
    </div>

    <div class="card" style="margin-top:24px;">
      <h3>Endpoints disponíveis</h3>
      <table id="endpoints"><tbody></tbody></table>
    </div>

    <div class="card">
      <h3>Última campanha</h3>
      <div id="ultima"></div>
    </div>
  </div>
  <script src="/layout.js"></script>
  <script>
    (async function() {
      const content = document.getElementById('main');
      try {
        const [root, health, healthDb] = await Promise.all([
          fetch('/').then(r=>r.json()),
          fetch('/health').then(r=>r.json()),
          fetch('/health/db').then(r=>r.json()),
        ]);

        if (health.dry_run) {
          document.getElementById('banner').innerHTML =
            '<div class="dry-run-banner">⚠ DRY_RUN ativo — envios Meta estão sendo simulados, não vão pra produção.</div>';
        }

        document.getElementById('stats').innerHTML = `
          <div class="stat"><div class="label">Serviço</div><div class="value ok">online</div></div>
          <div class="stat"><div class="label">Banco</div><div class="value ${healthDb.ok ? 'ok' : 'err'}">${healthDb.ok ? 'conectado' : 'erro'}</div></div>
          <div class="stat"><div class="label">DRY_RUN</div><div class="value ${health.dry_run ? 'warn' : 'ok'}">${health.dry_run ? 'ATIVO' : 'desligado'}</div></div>
          <div class="stat"><div class="label">Uptime</div><div class="value">${health.uptime_s}s</div></div>
          <div class="stat"><div class="label">Versão</div><div class="value">${root.version}</div></div>
        `;

        document.querySelector('#endpoints tbody').innerHTML = (root.endpoints || [])
          .map(e => `<tr><td><code>${e}</code></td></tr>`).join('');

        // Última campanha
        try {
          const list = await apiFetch('/api/disparos/list');
          const u = (list.campanhas || [])[0];
          document.getElementById('ultima').innerHTML = u
            ? `<p><b>${u.nome}</b> — ${u.status} (${u.enviadas}/${u.total_msgs})</p>`
            : '<p style="color:var(--text-dim)">Nenhuma campanha ainda.</p>';
        } catch (e) {
          document.getElementById('ultima').innerHTML = `<p class="error">${e.message}</p>`;
        }
      } catch (e) {
        content.innerHTML = '<div class="card"><p class="error">Erro ao carregar dashboard: ' + e.message + '</p></div>';
      }
    })();
  </script>
</body>
</html>
